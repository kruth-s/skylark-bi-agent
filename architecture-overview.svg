<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title description">
  <title id="title">Skylark BI Agent architecture overview</title>
  <desc id="description">A six-layer architecture diagram showing natural language queries moving through the FastAPI agent, Monday.com data, normalization, deterministic BI analysis, and verified leadership insights.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0810"/>
      <stop offset="1" stop-color="#17102a"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a06cff"/>
      <stop offset="1" stop-color="#6333bd"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#159f87"/>
      <stop offset="1" stop-color="#075e66"/>
    </linearGradient>
    <linearGradient id="insight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e08a3e"/>
      <stop offset="1" stop-color="#a64235"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c08bff"/>
    </marker>
    <style>
      .title { font: 700 38px 'Trebuchet MS', sans-serif; fill: #f8fafc; letter-spacing: 1px; }
      .subtitle { font: 400 17px 'Trebuchet MS', sans-serif; fill: #a8a1b7; }
      .node-title { font: 700 20px 'Trebuchet MS', sans-serif; fill: #ffffff; }
      .node-copy { font: 400 15px 'Trebuchet MS', sans-serif; fill: #e7e1f0; }
      .tag { font: 700 12px 'Courier New', monospace; fill: #d5c5ed; letter-spacing: 1px; }
      .flow { font: 600 13px 'Courier New', monospace; fill: #bcaed0; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#background)"/>
  <path d="M0 160 C340 90 520 230 850 145 S1290 75 1600 150" fill="none" stroke="#382557" stroke-width="2" opacity="0.65"/>
  <path d="M0 840 C340 760 550 900 870 820 S1300 750 1600 820" fill="none" stroke="#263d4a" stroke-width="2" opacity="0.55"/>

  <text x="100" y="90" class="title">ARCHITECTURE OVERVIEW</text>
  <text x="100" y="124" class="subtitle">From a founder's question to a verified, decision-ready answer</text>

  <g filter="url(#shadow)">
    <rect x="100" y="205" width="390" height="185" rx="18" fill="#1b1528" stroke="#8f5ee8" stroke-width="2"/>
    <rect x="100" y="205" width="390" height="10" rx="5" fill="url(#agent)"/>
    <text x="132" y="254" class="tag">01 / EXPERIENCE</text>
    <text x="132" y="290" class="node-title">Founder query</text>
    <text x="132" y="326" class="node-copy">Natural-language question</text>
    <text x="132" y="351" class="node-copy">Interactive chat console</text>
    <text x="132" y="376" class="node-copy">Clarification when scope is broad</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="605" y="205" width="390" height="185" rx="18" fill="#1b1528" stroke="#8f5ee8" stroke-width="2"/>
    <rect x="605" y="205" width="390" height="10" rx="5" fill="url(#agent)"/>
    <text x="637" y="254" class="tag">02 / ORCHESTRATION</text>
    <text x="637" y="290" class="node-title">FastAPI BI agent</text>
    <text x="637" y="326" class="node-copy">Intent detection and entity linking</text>
    <text x="637" y="351" class="node-copy">Read-only API routes</text>
    <text x="637" y="376" class="node-copy">Optional Groq explanation layer</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1110" y="205" width="390" height="185" rx="18" fill="#102521" stroke="#2bc1a2" stroke-width="2"/>
    <rect x="1110" y="205" width="390" height="10" rx="5" fill="url(#data)"/>
    <text x="1142" y="254" class="tag">03 / SOURCE SYSTEM</text>
    <text x="1142" y="290" class="node-title">Monday.com boards</text>
    <text x="1142" y="326" class="node-copy">Deals and Work Orders</text>
    <text x="1142" y="351" class="node-copy">GraphQL with cursor pagination</text>
    <text x="1142" y="376" class="node-copy">Caching, retries, and rate limits</text>
  </g>

  <line x1="490" y1="297" x2="595" y2="297" stroke="#c08bff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="512" y="278" class="flow">intent</text>
  <line x1="995" y1="297" x2="1100" y2="297" stroke="#c08bff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1010" y="278" class="flow">GraphQL</text>

  <g filter="url(#shadow)">
    <rect x="100" y="540" width="390" height="185" rx="18" fill="#102521" stroke="#2bc1a2" stroke-width="2"/>
    <rect x="100" y="540" width="390" height="10" rx="5" fill="url(#data)"/>
    <text x="132" y="589" class="tag">04 / RESILIENCE</text>
    <text x="132" y="625" class="node-title">Data normalization</text>
    <text x="132" y="661" class="node-copy">Dates, currency, nulls, and sectors</text>
    <text x="132" y="686" class="node-copy">Unified pandas DataFrames</text>
    <text x="132" y="711" class="node-copy">Quality caveats and traceability</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="605" y="540" width="390" height="185" rx="18" fill="#241d16" stroke="#e08a3e" stroke-width="2"/>
    <rect x="605" y="540" width="390" height="10" rx="5" fill="url(#insight)"/>
    <text x="637" y="589" class="tag">05 / ANALYTICS</text>
    <text x="637" y="625" class="node-title">Deterministic BI engine</text>
    <text x="637" y="661" class="node-copy">Pipeline, revenue, sectors, operations</text>
    <text x="637" y="686" class="node-copy">Cross-board correlation</text>
    <text x="637" y="711" class="node-copy">Authoritative Python calculations</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1110" y="540" width="390" height="185" rx="18" fill="#241d16" stroke="#e08a3e" stroke-width="2"/>
    <rect x="1110" y="540" width="390" height="10" rx="5" fill="url(#insight)"/>
    <text x="1142" y="589" class="tag">06 / DECISION OUTPUT</text>
    <text x="1142" y="625" class="node-title">Verified leadership insight</text>
    <text x="1142" y="661" class="node-copy">Evidence, interpretation, and caveats</text>
    <text x="1142" y="686" class="node-copy">Risks and recommendations</text>
    <text x="1142" y="711" class="node-copy">Executive-ready response</text>
  </g>

  <path d="M1305 390 V470 H295 V530" fill="none" stroke="#2bc1a2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="740" y="458" class="flow">raw records</text>
  <line x1="490" y1="632" x2="595" y2="632" stroke="#e08a3e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="508" y="613" class="flow">clean data</text>
  <line x1="995" y1="632" x2="1100" y2="632" stroke="#e08a3e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1017" y="613" class="flow">evidence</text>

  <rect x="100" y="835" width="1400" height="62" rx="12" fill="#0e0b17" stroke="#30243f"/>
  <circle cx="135" cy="866" r="8" fill="#2bc1a2"/>
  <text x="160" y="872" class="subtitle">Production principles</text>
  <text x="390" y="872" class="node-copy">read-only source access</text>
  <text x="695" y="872" class="node-copy">deterministic financial math</text>
  <text x="1060" y="872" class="node-copy">transparent data caveats</text>
</svg>
